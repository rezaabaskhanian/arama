# ============================================================
# آرامینا — docker-compose برای دیپلوی روی VPS
# سه سرویس: postgres + backend (Go) + frontend (Next.js)
# Traefik به عنوان reverse proxy با SSL خودکار (Let's Encrypt)
# مقادیر حساس از فایل .env در همین پوشه خوانده می‌شوند.
# ============================================================

services:
  traefik:
    image: traefik:v3.2
    container_name: aramina_traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/traefik.yml:ro
      - ./traefik/acme.json:/letsencrypt/acme.json
    networks:
      - aramina_net

  postgres:
    image: postgres:15-alpine
    container_name: aramina_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aramina_net

  backend:
    build:
      context: ./backend
    container_name: aramina_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENV: production
      RUN_MIGRATIONS: "true"
      LOG_LEVEL: info
      HTTP_PORT: 8086
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_SIGN_KEY: ${JWT_SIGN_KEY}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      MIGRATIONS_DIR: ./migrations
      FCM_CREDENTIALS_FILE: /root/serviceAccountKey.json
    volumes:
      - ./backend/serviceAccountKey.json:/root/serviceAccountKey.json:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`api.aramina.ir`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.backend.loadbalancer.server.port=8086"
    networks:
      - aramina_net

  frontend:
    build:
      context: ./frontend/mental-health-trauma
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: aramina_frontend
    restart: unless-stopped
    depends_on:
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`aramina.ir`) || Host(`www.aramina.ir`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"
    networks:
      - aramina_net

volumes:
  postgres_data:

networks:
  aramina_net:
    driver: bridge
